server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: ${MAX_HTTP_FORM_POST_SIZE:1MB}

spring:
  application:
    name: dongbac-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: DongBacHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:dongbac}
    default-schema: ${DB_SCHEMA:dongbac}
    create-schemas: true
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:dongbac}
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${MAX_MULTIPART_FILE_SIZE:1MB}
      max-request-size: ${MAX_MULTIPART_REQUEST_SIZE:1MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

app:
  http:
    max-json-body-bytes: ${MAX_JSON_BODY_BYTES:1048576}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://dong-bac-group.vercel.app,https://admin-dongbac-lhzv.vercel.app}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:}
    issuer: ${JWT_ISSUER:dongbac-backend}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
  auth:
    refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
    refresh-cookie-name: ${AUTH_REFRESH_COOKIE_NAME:dbsg_refresh}
    refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
    refresh-cookie-same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${AUTH_LOCK_MINUTES:15}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    bootstrap-admin-name: ${BOOTSTRAP_ADMIN_NAME:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    root-folder: ${CLOUDINARY_ROOT_FOLDER:dongbac}
    http-timeout-seconds: ${CLOUDINARY_HTTP_TIMEOUT_SECONDS:10}
  media:
    image-max-bytes: ${MEDIA_IMAGE_MAX_BYTES:10485760}
    video-max-bytes: ${MEDIA_VIDEO_MAX_BYTES:209715200}
    upload-intent-minutes: ${MEDIA_UPLOAD_INTENT_MINUTES:15}

info:
  app:
    name: Dong Bac Sai Gon API
    phase: Backend Phase 8
