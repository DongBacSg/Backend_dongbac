services:
  - type: web
    name: dongbac-backend
    runtime: docker
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SWAGGER_ENABLED
        value: "false"
      - key: MAX_JSON_BODY_BYTES
        value: "1048576"
      - key: DB_SCHEMA
        value: dongbac
      - key: CORS_ALLOWED_ORIGINS
        value: https://dong-bac-group.vercel.app,https://admin-dongbac-lhzv.vercel.app
      - key: JWT_ISSUER
        value: dongbac-backend
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: AUTH_REFRESH_COOKIE_NAME
        value: dbsg_refresh
      - key: AUTH_REFRESH_COOKIE_SECURE
        value: "true"
      - key: AUTH_REFRESH_COOKIE_SAME_SITE
        value: None
      - key: AUTH_MAX_FAILED_ATTEMPTS
        value: "5"
      - key: AUTH_LOCK_MINUTES
        value: "15"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET_BASE64
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_ROOT_FOLDER
        value: dongbac
      - key: CLOUDINARY_HTTP_TIMEOUT_SECONDS
        value: "10"
      - key: MEDIA_IMAGE_MAX_BYTES
        value: "10485760"
      - key: MEDIA_VIDEO_MAX_BYTES
        value: "209715200"
      - key: MEDIA_UPLOAD_INTENT_MINUTES
        value: "15"
